<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Locadora de Filmes</h1>
        <p class="descricao">Cadastre e gerencie os filmes disponíveis para locação.</p>
        <button id="btnBuscar">Buscar filmes</button>
        <p id="mensagem" role="status"></p>

        <h2>Filmes cadastrados</h2>
        <table>
            <thead><tr><th>ID</th><th>Título</th><th>Diretor</th><th>Ano</th><th>Gênero</th><th>Diária (R$)</th><th>Ações</th></tr></thead>
            <tbody id="listaFilmes"></tbody>
        </table>

        <section>
            <h2 id="tituloFormulario">Cadastrar filme</h2>
            <form id="formFilme">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" required maxlength="150">
                <label for="diretor">Diretor</label>
                <input type="text" id="diretor" name="diretor" required maxlength="100">
                <label for="ano">Ano de lançamento</label>
                <input type="number" id="ano" name="ano" min="1888" max="2100" required>
                <label for="genero">Gênero</label>
                <input type="text" id="genero" name="genero" required maxlength="60">
                <label for="valorDiaria">Valor da diária (R$)</label>
                <input type="number" id="valorDiaria" name="valorDiaria" min="0.01" step="0.01" required>
                <div class="botoes-formulario">
                    <button type="submit" id="btnSalvar">Cadastrar filme</button>
                    <button type="button" id="btnCancelar" hidden>Cancelar edição</button>
                </div>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
